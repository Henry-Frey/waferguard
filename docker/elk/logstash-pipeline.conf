# ──────────────────────────────────────────────────────────────────────────────
# WaferGuard Logstash pipeline
#
# Flow: Filebeat → Logstash (this file) → Elasticsearch
#
# Each line in the structlog JSON file looks like:
#   {"event": "classifier_loaded", "level": "info", "timestamp": "...", ...}
#
# Filebeat ships those lines with keys already at root (keys_under_root: true).
# Here we just normalise @timestamp and rename `event` to `message` so
# Kibana's default log view works out of the box.
# ──────────────────────────────────────────────────────────────────────────────

input {
  beats {
    port => 5044
  }
}

filter {
  # Map structlog's "timestamp" field to the canonical Elasticsearch @timestamp.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Kibana's Logs UI uses "message" as the display column.
  if [event] and ![message] {
    mutate {
      rename => { "event" => "message" }
    }
  }

  # Normalise log level to lowercase for consistent filtering.
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # One index per service per day, e.g. waferguard-serving-2024.01.15
    index => "waferguard-%{[fields][service]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
