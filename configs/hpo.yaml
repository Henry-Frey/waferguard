# HPO configuration — merged on top of base.yaml at runtime.
#
# Run with:
#   python -m src.training.hpo
#
# The config loader reads base.yaml first, then overlays this file.
# Any key here overrides the corresponding key in base.yaml.

hpo:
  # ── Study settings ──────────────────────────────────────────────────────────
  study_name: waferguard_hpo
  n_trials: 20              # Total Optuna trials to run
  trial_epochs: 30          # Epochs per trial (< full 100 to save time)

  # ── TPE / Pruning ────────────────────────────────────────────────────────────
  n_startup_trials: 5       # Random exploration before TPE posterior is used
  n_warmup_steps: 3         # Min epochs before MedianPruner can fire in a trial

  # ── Output ───────────────────────────────────────────────────────────────────
  artifact_dir: artifacts/hpo   # Directory for per-trial checkpoints + best_hparams.yaml
  ensemble_top_k: 3             # Number of top trials to use when building ensemble
